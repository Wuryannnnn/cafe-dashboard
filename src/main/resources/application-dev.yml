spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sell?characterEncoding=utf-8&useSSL=false}
  jpa:
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  redis:
    host: 127.0.0.1
    port: 6379
#logging:
#  pattern:
#    console: "%d - %msg%n"
##  path: /var/log/tomcat/
#  file: /var/log/tomcat/sell.log
#  level:
#    com.sell.LoggerTest: debug

wechat:
  # 凭据改为从环境变量注入, 不再硬编码进仓库 (与 application-prod.yml 一致).
  # 注意: 历史提交里已包含旧值, 请轮换 mchKey / openAppSecret 等密钥.
  # 公众账号, 授权
  mpAppId: ${WECHAT_MP_APPID:}
  mpAppSecret: ${WECHAT_MP_APPSECRET:}

  # 开放平台,  卖家扫码登录用
  openAppId: ${WECHAT_OPEN_APPID:}
  openAppSecret: ${WECHAT_OPEN_APPSECRET:}

  # 支付/商户号
  mchId: ${WECHAT_MCH_ID:}
  mchKey: ${WECHAT_MCH_KEY:}
  # 发起支付不需要证书, 退款需要
  keyPath:
  notifyUrl: ${WECHAT_NOTIFY_URL:http://sell.natapp4.cc/sell/pay/notify}
  templateId:
    orderStatus: ${WECHAT_TPL_ORDER_STATUS:}

# 支付宝
alipay:
  appId:
  privateKey:
  aliPayPublicKey:
  notifyUrl: http://sell.natapp4.cc/sell/pay/alipay/notify
  returnUrl: http://sell.natapp4.cc/sell/#/order

projectUrl:
  wechatMpAuthorize: http://lsx888.natapp1.cc
  wechatOpenAuthorize: http://lsx888.natapp1.cc
  sell: http://lsx888.natapp1.cc
logging:
  level:
    com.sell.dataobject.mapper: trace
mybatis:
  mapper-locations: classpath:mapper/*.xml

# 又拍云服务 见 https://console.upyun.com/services/file/
upyun:
  bucketName: ${UPYUN_BUCKET:}
  userName: ${UPYUN_USERNAME:}
  password: ${UPYUN_PASSWORD:}
  imageHost: ${UPYUN_IMAGE_HOST:}
server:
  servlet:
    context-path: /sell
    