spring:
  main:
    allow-circular-references: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cafe?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:cafe}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-local.sql
      continue-on-error: true   # 重复 INSERT 报错忽略, 第一次启动后种子数据就在了

  jackson:
    default-property-inclusion: non_null

wechat:
  # 生产凭据全部走环境变量; 未设置=空(表示"未接入支付"), 而不是 "test" 占位
  # (占位值会让微信返回 "mch_id参数格式错误", 误导排查). 接入说明见 doc/支付接入说明.md
  mpAppId: ${WECHAT_MP_APPID:}
  mpAppSecret: ${WECHAT_MP_APPSECRET:}
  openAppId: ${WECHAT_OPEN_APPID:}
  openAppSecret: ${WECHAT_OPEN_APPSECRET:}
  mchId: ${WECHAT_MCH_ID:}
  mchKey: ${WECHAT_MCH_KEY:}
  keyPath: ${WECHAT_KEY_PATH:}
  notifyUrl: ${WECHAT_NOTIFY_URL:}
  templateId:
    orderStatus: ${WECHAT_TPL_ORDER_STATUS:}
  # ===== 小程序 (登录 + APIv3 支付) =====
  # 凭据齐全后设 WECHAT_MINI_ENABLED=true 才装配 APIv3 Bean.
  mini:
    enabled: ${WECHAT_MINI_ENABLED:false}
    appId: ${WECHAT_MINI_APPID:}
    appSecret: ${WECHAT_MINI_APPSECRET:}
    mchId: ${WECHAT_MINI_MCH_ID:}
    merchantSerialNo: ${WECHAT_MINI_MERCHANT_SERIAL:}
    privateKeyPath: ${WECHAT_MINI_PRIVATE_KEY_PATH:}
    apiV3Key: ${WECHAT_MINI_APIV3_KEY:}
    wechatPayPublicKeyId: ${WECHAT_MINI_PUBKEY_ID:}
    wechatPayPublicKeyPath: ${WECHAT_MINI_PUBKEY_PATH:}
    notifyUrl: ${WECHAT_MINI_NOTIFY_URL:}

alipay:
  sandbox: ${ALIPAY_SANDBOX:false}   # 生产默认关沙箱(真实扣款)
  appId: ${ALIPAY_APP_ID:}
  privateKey: ${ALIPAY_PRIVATE_KEY:}
  aliPayPublicKey: ${ALIPAY_PUBLIC_KEY:}
  notifyUrl: ${ALIPAY_NOTIFY_URL:}
  returnUrl: ${ALIPAY_RETURN_URL:}

projectUrl:
  # 必须是公网可达的域名, 否则微信/支付宝回调不到, 订单不会变"已支付"
  wechatMpAuthorize: ${PROJECT_URL:http://localhost:8080}
  wechatOpenAuthorize: ${PROJECT_URL:http://localhost:8080}
  sell: ${PROJECT_URL:http://localhost:8080}

logging:
  level:
    com.sell: info

mybatis:
  mapper-locations: classpath:mapper/*.xml

upyun:
  bucketName: test
  userName: test
  password: test
  imageHost: ""

server:
  servlet:
    context-path: /sell
